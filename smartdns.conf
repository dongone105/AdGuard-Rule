# smartdns.conf
# 监听端口（只监听 IPv4，避免与 IPv6 通配地址双栈冲突导致 bind 失败）
bind 0.0.0.0:5053 -no-rule-addr -no-rule-nameserver -no-dualstack-selection -force-aaaa-soa -no-speed-check -no-cache

#### log ####
log-num 0

#### 缓存 ####
cache-size 0

#### IPV6 #####
dualstack-ip-selection no
force-AAAA-SOA yes

#### 测速 ####
response-mode fastest-response

#### 并发保护 ####
max-query-limit 200

#### 其它 ####
# 强制指定 qtype 返回 SOA。禁用 SOA 65
force-qtype-SOA 65
# TCP 链接空闲超时时间
tcp-idle-time 120

# 此处利用 SmartDNS 的 EDNS 客户端子网，解析上海电信（222.66.251.8 为上海电信 DNS IP）优化的访问 IP。
# Google
server-tls 8.8.8.8 -subnet 222.66.251.8/32
server-tls 8.8.4.4 -subnet 222.66.251.8/32
# Quad9
server-tls 9.9.9.11 -subnet 222.66.251.8/32
server-tls 149.112.112.11 -subnet 222.66.251.8/32
# AliDNS
server-tls 223.5.5.5 -subnet 222.66.251.8/32
server-tls 223.6.6.6 -subnet 222.66.251.8/32
# DNSPod
server-tls 1.12.12.12 -subnet 222.66.251.8/32
server-tls 120.53.53.53 -subnet 222.66.251.8/32
# 360
server-tls 101.226.4.6 -subnet 222.66.251.8/32
server-tls 218.30.118.6 -subnet 222.66.251.8/32
server-tls 123.125.81.6 -subnet 222.66.251.8/32
