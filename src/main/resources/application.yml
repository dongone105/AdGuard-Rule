  #DNS 域名有效性校验：对 DNS_FILTER/DNS_EXCEPTION（||domain^ 形式的规范域名规则）中的域名
  #做真实 DNS 解析，剔除已经无法解析（域名失效/过期/已注销）的规则；国内、国外各配置几组
  #DNS 交叉验证，任意一台能解析出结果即视为有效，全部失败（含重试）才剔除
  dns:
    enabled: true
    timeout: 3                      #单次查询超时(秒)，同一域名对所有服务器是并发查询的
    retries: 1                      #首轮全部失败后，额外重试的轮次数
    max-concurrent-queries: 3000    #同时在飞的域名校验数，异步IO不占线程，可以设得比原来大一个数量级
    check-aaaa: false               #是否额外查询AAAA(IPv6)记录，关闭可把单域名查询数减半，是提速最直接的一步
    max-duration-minutes: 28        #整个校验阶段的硬性时长上限(分钟)，防止拖垮CI的30分钟限制
    progress-log-interval-seconds: 15  #进度日志打印间隔(秒)，避免长时间没有任何输出
    max-failure-ratio: 0.3          #实际查询域名中失败率超过该阈值，判定DNS环境异常，本次跳过剔除
    cache-enabled: true             #是否启用磁盘缓存，跳过近期已验证域名，大幅缩短重复运行耗时
    cache-path: 'rule/dns-cache.txt' #缓存文件(不以.开头，会被现有CI提交步骤自动一并提交、天然跨运行持久化)
    cache-ttl-hours: 168            #有效域名缓存有效期(小时)，拉长到7天，减少重复查询已确认存活的域名
    invalid-cache-ttl-hours: 24     #失效域名缓存有效期(小时)，避免对已确认下线的域名反复真实查询
    servers:
      - '223.5.5.5'       #阿里DNS
      - '119.29.29.29'    #DNSPod
      - '114.114.114.114' #114DNS
      - '8.8.8.8'         #Google
      - '1.1.1.1'         #Cloudflare
      - '9.9.9.9'         #Quad9
  output:
    path: rule   #规则文件输出路径，相对路径默认从 项目目录开始
    files:
      all.txt:    #输出文件名
        - DNS_EXCEPTION #AdGuard Home例外规则
        - DNS_FILTER #规范域名拦截规则
        - HOSTS   #Hosts规则
        - REGEX   #严格正则规则，AdGH支持
        - MODIFY  #AdGuard客户端专用规则
      adgh.txt:
        - DNS_EXCEPTION
        - DNS_FILTER
        - REGEX
      hosts.txt:
        - HOSTS
      regex.txt:
        - REGEX
      domain.txt:
        - DNS_EXCEPTION
        - DNS_FILTER
      modify.txt:
        - MODIFY
        
