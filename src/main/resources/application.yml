spring:
  application:
    name: adg-rule
  profiles:
    active: prod  #切换至 dev 即可输出调试信息

logging:
  file:
    path: ./logs

application:
  rule:
    #远程规则-黑名单
    remote:
      - 'https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockdns.txt'  #217heidai-adblockfilters
      - 'https://anti-ad.net/easylist.txt'  #anti-AD
      - 'https://raw.githubusercontent.com/mphin/adguardhome_rules/main/Blacklist.txt'  #anti-AD-plus_blocklist
      - 'https://cdn.jsdelivr.net/gh/sbwml/halflife-list@master/ad.txt'  #Halflife
      - 'https://raw.githubusercontent.com/afwfv/DD-AD/refs/heads/release/easylist.txt'  #DD-AD
      - 'https://raw.githubusercontent.com/rssvcn/qy-Ads-Rule/main/black.txt'  #qy-Ads-Rule
      - 'https://raw.githubusercontent.com/2Gardon/SM-Ad-FuckU-hosts/master/SMAdHosts'  #SMAdHosts
      - 'https://raw.githubusercontent.com/qq5460168/666/refs/heads/master/rules.txt'  #那个谁520规则
      - 'https://raw.githubusercontent.com/TTDNS/Cat/refs/heads/main/DNS.TXT'  #TTDNS
      - 'https://raw.githubusercontent.com/Kuroba-Sayuki/FuLing-AdRules/Master/FuLingRules/FuLingBlockList.txt'  #茯苓广告规则
      - 'https://raw.githubusercontent.com/2771936993/HG/main/hg1.txt'  #HG
      - 'https://github.com/Lynricsy/HyperADRules/releases/latest/download/hyper_adrules_ads_adguard.txt'  #hyper_adrules_ads_adguard
      - 'https://github.com/Lynricsy/HyperADRules/releases/latest/download/hyper_adrules_malware_adguard.txt'  #hyper_adrules_malware_adguard
      - 'https://raw.githubusercontent.com/miaoermua/AdguardFilter/main/rule.txt'  #喵二黑名单
      - 'https://raw.githubusercontent.com/Kuner-mw/DNS-Kuner/main/FilterRules/blacklist.txt'  #DNS-Kuner_blacklist.txt
      - 'https://adguardteam.github.io/HostlistsRegistry/assets/filter_67.txt'  #HaGeZi's Apple Tracker Blocklist
      - 'https://adguardteam.github.io/HostlistsRegistry/assets/filter_60.txt'  #HaGeZi's Xiaomi Tracker Blocklist
      - 'https://adguardteam.github.io/HostlistsRegistry/assets/filter_65.txt'  #HaGeZi's Vivo Tracker Blocklist
      - 'https://adguardteam.github.io/HostlistsRegistry/assets/filter_61.txt'  #HaGeZi's Samsung Tracker Blocklist
      - 'https://raw.githubusercontent.com/AdguardTeam/HostlistsRegistry/refs/heads/main/filters/other/filter_66_HageziOppoRealmeTrackerBlocklist/filter.txt'  #HaGeZi's OPPO & Realme Tracker Blocklist
      - 'https://raw.githubusercontent.com/lingeringsound/adblock_auto/main/Rules/adblock_auto.txt'  #lingeringsound adblock_auto
      
      
    #远程规则-白名单
      - 'https://raw.githubusercontent.com/Kuroba-Sayuki/FuLing-AdRules/Master/FuLingRules/FuLingAllowList.txt'  #茯苓允许列表
      - 'https://raw.githubusercontent.com/qq5460168/666/master/allow.txt'  #那个谁520广告白名单
      - 'https://raw.githubusercontent.com/mphin/adguardhome_rules/main/Allowlist.txt'  #anti-AD-plus_allowlist
      - 'https://raw.githubusercontent.com/Kuner-mw/DNS-Kuner/main/FilterRules/allowlist.txt'  #DNS-Kuner_allowlist
      - 'https://raw.githubusercontent.com/miaoermua/AdguardFilter/main/whitelist.txt'  #喵二白名单
      - 'https://github.com/Lynricsy/HyperADRules/releases/latest/download/hyper_adrules_allow_adguard.txt'  #hyper_adrules_allow_adguard
      
    #本地规则
    local: #本地规则请将文件移动到项目路径rule目录中
      - 'mylist.txt'
  #DNS 域名有效性校验：对 DNS_FILTER/DNS_EXCEPTION（||domain^ 形式的规范域名规则）中的域名
  #做真实 DNS 解析，剔除已经无法解析（域名失效/过期/已注销）的规则；国内、国外各配置几组
  #DNS 交叉验证，任意一台能解析出结果即视为有效，全部失败（含重试）才剔除
  dns:
    enabled: true
    timeout: 2                      #单次查询超时(秒)，同一域名对所有服务器是并发查询的
    retries: 1                      #首轮全部失败后，额外重试的轮次数
    max-concurrent-queries: 500    #同时在飞的域名校验数，异步IO不占线程，可以设得比原来大一个数量级
    check-aaaa: false               #是否额外查询AAAA(IPv6)记录，关闭可把单域名查询数减半，是提速最直接的一步
    max-duration-minutes: 60        #整个校验阶段的硬性时长上限(分钟)
    progress-log-interval-seconds: 15  #进度日志打印间隔(秒)，避免长时间没有任何输出
    max-failure-ratio: 0.15          #实际查询域名中失败率超过该阈值，判定DNS环境异常，本次跳过剔除
    restart-batch-size: 30000       #每处理多少个域名重启一次本地SmartDNS，防止长跑任务里守护进程状态退化；参考adblockfilters的health_check_interval，设0关闭该机制
    restart-command: 'sh ${SMARTDNS_PATH:/tmp/smartdns}/restart-smartdns.sh' #批次边界触发的重启命令；SMARTDNS_PATH由CI workflow设置，本地无该sidecar时把restart-batch-size设为0即可
    restart-timeout-seconds: 90     #等待重启命令自身执行完成的超时时间(秒)，超时只记警告、不中断本轮校验
    connect-probe-enabled: true     #先做TCP连接探测(80/443)，连通即直接判定存活，不消耗真实DNS查询；不经过本地SmartDNS，独立于其缓存/负载状态
    connect-probe-timeout-ms: 3000  #单次TCP连接探测超时(毫秒)
    health-check-enabled: true      #批次重启SmartDNS前后主动做健康检查
    health-check-timeout-seconds: 5 #单次健康检查查询超时(秒)
    health-check-initial-backoff-seconds: 5  #健康检查失败后的初始退避等待(秒)，之后每次翻倍
    health-check-max-wait-seconds: 600       #健康检查最长等待时间(秒)，超时放弃等待、继续后续校验

    servers:
      - '127.0.0.1:5053'  #本地 smartdns 入口，原 6 台公网 DNS 已挪进根目录 smartdns.conf 的上游配置里
  output:
    path: rule   #规则文件输出路径，相对路径默认从 项目目录开始
    files:
      all.txt:    #输出文件名
        - DNS_FILTER #规范域名拦截规则
        - HOSTS   #Hosts规则
        - REGEX   #严格正则规则，AdGH支持
        - MODIFY  #AdGuard客户端专用规则
      Dnsblock.txt:
        - DNS_FILTER
        - REGEX
      hosts.txt:
        - HOSTS
      regex.txt:
        - REGEX
      domain.txt:
        - DNS_FILTER
      modify.txt:
        - MODIFY
      Dnsallow.txt:              #新增：单独输出的白名单/放行规则（@@||domain^）
        - DNS_EXCEPTION
