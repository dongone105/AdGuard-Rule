name: Update Filters
on:
  push:
    paths-ignore:
      - 'README.md'
      - '*.md'
    branches: [ main ]
  schedule:
    - cron: 0 */12 * * *
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  SMARTDNS_PATH: /tmp/smartdns
  # SmartDNS 自身的查询缓存持久化文件，放在 rule/ 下以便和规则文件一起被 Commit Changes 步骤提交，
  # 跨 CI 运行复用；取代了原先 Java 侧 rule/dns-cache.txt 那套「校验结论缓存」
  SMARTDNS_CACHE_DUMP: rule/smartdns-cache.dump

permissions:
  contents: write
  actions: write

concurrency:
  group: update-filters-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Update_Filters:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Setup SmartDNS
        run: |
          set -e
          mkdir -p "$SMARTDNS_PATH"
          sudo apt-get update -y
          sudo apt-get install -y dnsutils

          # 恢复上次运行持久化下来的查询缓存（若是首次运行则该文件不存在，跳过即可）
          if [ -f "$SMARTDNS_CACHE_DUMP" ]; then
            cp "$SMARTDNS_CACHE_DUMP" "$SMARTDNS_PATH/cache.dump"
            echo "已恢复 SmartDNS 缓存: $(du -h "$SMARTDNS_PATH/cache.dump" | cut -f1)"
          fi

          max_attempts=5
          sleep_seconds=5
          for attempt in $(seq 1 $max_attempts); do
            echo "SmartDNS setup attempt ${attempt}/${max_attempts}"
            LATEST_URL="https://github.com/pymumu/smartdns/releases/latest/download/smartdns-x86_64"
            if wget -q "$LATEST_URL" -O "$SMARTDNS_PATH/smartdns" && [ -s "$SMARTDNS_PATH/smartdns" ]; then
              chmod +x "$SMARTDNS_PATH/smartdns"
              cp config/smartdns.conf "$SMARTDNS_PATH/smartdns.conf"
              cp scripts/restart-smartdns.sh "$SMARTDNS_PATH/restart-smartdns.sh"
              chmod +x "$SMARTDNS_PATH/restart-smartdns.sh"
              nohup "$SMARTDNS_PATH/smartdns" -f -x -c "$SMARTDNS_PATH/smartdns.conf" > /dev/null 2>&1 &
              echo "$!" > "$SMARTDNS_PATH/smartdns.pid"
              echo "SmartDNS started."
              break
            else
              echo "SmartDNS download failed or empty binary."
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "SmartDNS setup failed after ${max_attempts} attempts."
              exit 1
            fi
            sleep "$sleep_seconds"
            sleep_seconds=$((sleep_seconds * 2))
          done

      - name: Wait for SmartDNS
        run: |
          for i in $(seq 1 60); do
            if dig @127.0.0.1 -p 5053 example.com A +time=2 +tries=1 +short > /dev/null 2>&1; then
              echo "SmartDNS ready."
              exit 0
            fi
            echo "SmartDNS not ready yet, waiting... ($i/60)"
            sleep 1
          done
          echo "SmartDNS failed to become ready, dumping log:"
          tail -n 200 "$SMARTDNS_PATH/smartdns.log" 2>/dev/null || true
          exit 1

      - name: Run Jar
        run: |
          ulimit -n 65536
          java -jar ./target/adg-rule-1.0.0.jar

      - name: Persist SmartDNS cache
        if: always()
        run: |
          # 先礼貌地 SIGTERM 让 SmartDNS 触发一次落盘（cache-persist + cache-checkpoint-time
          # 平时也会周期性落盘，这里是保证退出前最后一份缓存也不丢），再拷回仓库目录等待提交
          if [ -f "$SMARTDNS_PATH/smartdns.pid" ]; then
            kill -TERM "$(cat "$SMARTDNS_PATH/smartdns.pid")" 2>/dev/null || true
            sleep 2
          fi
          mkdir -p "$(dirname "$SMARTDNS_CACHE_DUMP")"
          if [ -f "$SMARTDNS_PATH/cache.dump" ]; then
            cp "$SMARTDNS_PATH/cache.dump" "$SMARTDNS_CACHE_DUMP"
            echo "已保存 SmartDNS 缓存: $(du -h "$SMARTDNS_CACHE_DUMP" | cut -f1)"
          fi

      - name: Commit Changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- rule/*.txt "$SMARTDNS_CACHE_DUMP")" ]; then
              exit 0
          else
            echo "status=success" >> $GITHUB_OUTPUT
            git add -- rule/*.txt "$SMARTDNS_CACHE_DUMP"
            git config --local user.name "actions"
            git config --local user.email "action@github.com"
            git commit -m "CI Updated at $(date +'%Y-%m-%d %H:%M:%S')" -- rule/*.txt "$SMARTDNS_CACHE_DUMP"
          fi

      - name: Push rule updates
        if: steps.commit.outputs.status == 'success' && !cancelled()
        run: git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Mirror Refresh
        run: sleep 10 && curl 'https://purge.jsdelivr.net/gh/${{github.repository}}/rule'


      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 2
          
