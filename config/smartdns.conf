# smartdns.conf
# 监听端口（只监听 IPv4，避免与 IPv6 通配地址双栈冲突导致 bind 失败）
bind 0.0.0.0:5053 -no-rule-addr -no-rule-nameserver -no-dualstack-selection -force-aaaa-soa -no-speed-check -no-cache

#### log ####
# 日志级别 off、fatal、error、warn、notice、info 或 debug
log-level warn
# 日志文件路径
log-file /tmp/smartdns/smartdns.log

#### 缓存 ####
# 域名结果缓存个数，1 条缓存占内存 512 字节。0 关闭缓存，不配置为系统自动设置（系统内存 128 M，自动缓存 32768 条占内存 16 M；系统内存 256 M，自动缓存 65536 条占内存 32 M；系统内存 512 M，自动缓存 131072 条占内存 64 M；系统内存大于 512 M，自动缓存 262144 条占内存 128 M）。
#cache-size 65536
# 是否持久化缓存。自动，当 cache-file 所在的位置有超过 128 MB 的可用空间时启用，否则禁用
cache-persist yes
# 缓存持久化文件路径
cache-file /tmp/smartdns/cache.dump
# TTL 到期后不会丢弃缓存，而是继续拿旧结果作答并标记为"过期"，直到serve-expired-ttl 超时才会真正丢弃、走一次新的上游查询
serve-expired yes
# 7 天与原应用层「有效域名」缓存周期(cache-ttl-hours=168)保持一致
serve-expired-ttl 604800
serve-expired-reply-ttl 5

#### IPV6 #####
dualstack-ip-selection no
force-AAAA-SOA yes

#### 测速 ####
response-mode fastest-response

#### 并发保护 ####
max-query-limit 200

#### 其它 ####
# 强制指定 qtype 返回 SOA。禁用 SOA 65
force-qtype-SOA 65
# TCP 链接空闲超时时间
tcp-idle-time 120

#### 上游 DNS 服务 ####
# 此处利用 SmartDNS 的 EDNS 客户端子网，解析上海电信（202.96.209.133 为上海电信 DNS IP）优化的访问 IP。

# Global
# Google
server-tls 8.8.8.8:853
server-tls 8.8.4.4:853
# Cloudflare
server-tls 1.1.1.1:853
server-tls 1.0.0.1:853
# DNS.SB
server-tls 185.222.222.222:853
# Quad9
server-tls 9.9.9.11:853

# China
# Google
server-tls 8.8.4.4:853 -subnet 202.96.209.133
# Cloudflare
server-tls 1.0.0.1:853 -subnet 202.96.209.133
# DNS.SB
server-tls 185.222.222.222:853 -subnet 202.96.209.133
# AliDNS
server-tls 223.5.5.5:853 -subnet 202.96.209.133
# DNSPod
server-tls 1.12.12.12:853 -subnet 202.96.209.133
# 360
server-tls 101.226.4.6:853 -subnet 202.96.209.133
